<!DOCTYPE html>
<html lang="en">

<head>
  <title>TerraHacks 2025 - Constellation</title>
  <link rel="i/con" href="favicon.ico" type="image/x-icon" />
  <link href="./output.css" rel="stylesheet" />
</head>

<body class="min-h-screen text-terrahacks-gray">
  <div id="nodePanel" class="hidden absolute top-0 left-0 p-6 max-w-md">
    <h3 id="nodeMajor" class="font-light text-stone-300 tracking-normal font-space-mono uppercase text-xl my-2"></h3>
    <h1 id="nodeName" class="text-6xl font-space-mono tracking-tight"></h1>

    <div class="mt-2 font-untitled-sans font-light text-stone-200 text-2xl">
      <span id="nodeDescription" class=""></span>
    </div>
  </div>
  <div class="absolute top-0 right-0 p-6 text-4xl font-tiempos-headline text-socratica-cream text-right">
    <div>Terrahacks 2025</div>
    <div class="text-lg font-light text-stone-300">Constellation</div>
  </div>
  <div class="absolute bottom-0 right-0 p-6 font-untitled-sans">
    <div class="font-normal text-socratica-grey text-lg text-right">
      They should meet
    </div>

    <div id="topMatchName" class="uppercase text-3xl font-normal tracking-tighter font-space-mono text-right"></div>
    <div id="topMatchResponse" class="max-w-md font-light text-sm font-untitled-sans text-right"></div>
  </div>
  <div class="absolute p-6 bottom-0 text-stone-600 font-untitled-sans text-lg">
    <div id="nodeConnections"></div>
    <div id="nodeAttendees"></div>
  </div>

  <script src="bundle.js"></script>
</body>

</html>
